name: EMA9 pivot watch
on:
  schedule:
    # 05:00-23:00 IST, Mon-Fri. GitHub cron is UTC (IST = UTC+5:30).
    - cron: "30,45 23 * * 0-4"      # 05:00 and 05:15 IST (Mon-Fri)
    - cron: "*/15 0-16 * * 1-5"     # 05:30-22:15 IST
    - cron: "0,15,30 17 * * 1-5"    # 22:30, 22:45, 23:00 IST
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message instead of a normal check"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Alert memory (state.json) lives on its own `state` branch so main stays free of bot commits.
      - name: Load state
        run: |
          git fetch -q origin state:refs/remotes/origin/state || true
          git show origin/state:state.json > state.json 2>/dev/null || echo '{"sent": []}' > state.json
      - run: python watcher.py ${{ inputs.test && '--test' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always()
        run: |
          cp state.json "$RUNNER_TEMP/state.json"
          rm -f state.json
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          if git rev-parse -q --verify origin/state >/dev/null; then
            git checkout -q -B state origin/state
          else
            git checkout -q --orphan state
            git rm -rfq . 
          fi
          cp "$RUNNER_TEMP/state.json" state.json
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -q -m "update state"
            git push -q origin state
          fi
