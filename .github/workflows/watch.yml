name: EMA9 pivot watch
on:
  schedule:
    # 05:00-23:00 IST, Mon-Fri. GitHub cron is UTC (IST = UTC+5:30).
    - cron: "30,45 23 * * 0-4"      # 05:00 and 05:15 IST (Mon-Fri)
    - cron: "*/15 0-16 * * 1-5"     # 05:30-22:15 IST
    - cron: "0,15,30 17 * * 1-5"    # 22:30, 22:45, 23:00 IST
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message instead of a normal check"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python watcher.py ${{ inputs.test && '--test' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "watcher-bot"
            git config user.email "watcher-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git pull --rebase -X theirs || true
            git push
          fi
