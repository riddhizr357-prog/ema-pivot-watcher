name: EMA9 pivot watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message instead of a normal check"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python watcher.py ${{ inputs.test && '--test' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "watcher-bot"
            git config user.email "watcher-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
